<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suno Label Grid - Editor</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #11131a;
      --ink: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #6ad1ff;
      --accent-2: #ffd166;
      --ring: #2b303b;
      --gap: 1rem;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.28);
      --good: #2ecc71;
      --warn: #ffb020;
      --danger: #ff5c5c;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 20% -10%, #122 0%, transparent 60%),
                  radial-gradient(900px 500px at 120% -20%, #22121f 0%, transparent 55%),
                  var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: saturate(140%) blur(10px);
      background: color-mix(in oklab, var(--panel) 84%, transparent);
      border-bottom: 1px solid var(--ring);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: .9rem 1.1rem; }
    .row { display: grid; grid-template-columns: auto 1fr auto; gap: .75rem; align-items: center; }

    #file { display: none; }
    .btn {
      appearance: none; border: 0; cursor: pointer; color: var(--ink);
      background: linear-gradient(180deg, #1a2030, #121622);
      border: 1px solid var(--ring);
      padding: .55rem .8rem; border-radius: 10px; box-shadow: var(--shadow);
      user-select: none;
    }
    .btn.small { padding: .35rem .6rem; font-size: 12px; }
    .btn.good { border-color: #274834; }
    .btn.warn { border-color: #4a3a1d; }
    .btn.danger { border-color: #4a2323; }
    .btn:hover { border-color: color-mix(in oklab, var(--ring), var(--ink) 25%); }

    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; }

    .search { width: 100%; display: flex; gap: .5rem; align-items: center; }
    .search input {
      width: 100%; background: #0f1220; color: var(--ink);
      border: 1px solid var(--ring); border-radius: 12px; padding: .6rem .8rem;
    }
    .select { background: #0f1220; color: var(--ink); border: 1px solid var(--ring); border-radius: 10px; padding: .5rem .6rem; }

    .dropzone {
      margin: 18px auto 0; max-width: 1280px; border: 1.5px dashed #2c3445; border-radius: var(--radius);
      padding: 22px; text-align: center; color: var(--muted);
    }
    .dropzone.drag { border-color: var(--accent); color: var(--accent); }

    main { max-width: 1340px; margin: 0 auto; padding: 1.2rem 1rem 2.5rem; display: grid; grid-template-columns: 1fr 300px; gap: 1rem; }

    .grid {
      display: grid; gap: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      align-content: start;
    }

    .card { display: grid; gap: .55rem; text-decoration: none; color: inherit; position: relative; }
    .card.sel .cover { outline: 2px solid var(--accent); }
    .card:hover .pick { opacity: 1; }

    .cover {
      position: relative; aspect-ratio: 1 / 1; overflow: hidden; border-radius: var(--radius);
      background: #0f1220; border: 1px solid var(--ring); box-shadow: var(--shadow);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(105%); }
    .cover .badge {
      position: absolute; right: 8px; top: 8px; padding: .22rem .45rem; border-radius: 999px;
      font-size: 12px; letter-spacing: .02em; background: #0b1320cc; color: var(--ink); border: 1px solid #27314a;
    }
    .cover .badge.alt { left: 8px; right: auto; background: #20130bcc; border-color: #3d2a1d; }

    .pick { position: absolute; left: 8px; bottom: 8px; display: flex; gap: .4rem; align-items: center; opacity: .85; transition: opacity .15s; }
    .pick input[type="checkbox"] { width: 18px; height: 18px; }

    .meta { display: grid; gap: .2rem; }
    .title { font-weight: 600; font-size: 14px; line-height: 1.3; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .subtitle { color: var(--muted); font-size: 12px; }
    .albumchip { display: inline-block; font-size: 11px; color: var(--ink); opacity: .9; border: 1px solid var(--ring); padding: .05rem .4rem; border-radius: 999px; }

    .empty { color: var(--muted); text-align: center; padding: 2rem 0; }

    aside.panel {
      position: sticky; top: 74px; align-self: start; background: #0e1120; border: 1px solid var(--ring); border-radius: 14px; padding: .8rem; box-shadow: var(--shadow);
      display: grid; gap: .6rem;
    }
    .panel h3 { margin: .2rem 0 .1rem; font-size: 14px; }
    .panel .field { display: grid; gap: .25rem; }
    .panel input, .panel select, .panel textarea { width: 100%; background: #0f1220; color: var(--ink); border: 1px solid var(--ring); border-radius: 10px; padding: .5rem .6rem; font: inherit; }
    .panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }

    footer { color: var(--muted); text-align: center; padding: 1rem; }
    .small { font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap row">
      <div class="toolbar">
        <label class="btn" for="file">Load CSV</label>
        <input id="file" type="file" accept=".csv,text/csv" />

        <button id="export" class="btn good" title="Export modified CSV">Export CSV</button>
        <button id="newAlbum" class="btn" title="Create album">New Album</button>
        <button id="assignAlbum" class="btn" title="Assign selected to album">Assign to Album</button>
        <button id="clearAlbum" class="btn" title="Remove album from selected">Clear Album</button>
        <button id="deleteSel" class="btn danger" title="Delete selected">Delete</button>
        <button id="dedupe" class="btn warn" title="Remove duplicates by URL">Dedupe by URL</button>
        <button id="normalize" class="btn" title="Clean titles and whitespace">Normalize</button>
      </div>

      <div class="search">
        <input id="q" placeholder="Search titles, model, album…" autocomplete="off" />
      </div>

      <select id="sort" class="select" title="Sort">
        <option value="title">Title A → Z</option>
        <option value="duration">Duration short → long</option>
        <option value="album">Album A → Z</option>
      </select>
    </div>
  </header>

  <div id="dz" class="dropzone">Drop your CSV here or use Load CSV. Nothing is uploaded - it all runs locally in your browser.</div>

  <main>
    <section>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>Load a CSV to see your tracks.</div>
    </section>

    <aside class="panel">
      <h3>Editor</h3>
      <div class="small" id="selCount">0 selected</div>
      <div class="field"><label>Album</label>
        <select id="albumSel"></select>
      </div>
      <div class="field"><label>Title</label>
        <input id="edTitle" placeholder="Title"/>
      </div>
      <div class="row">
        <div class="field"><label>Duration</label>
          <input id="edDuration" placeholder="mm:ss"/>
        </div>
        <div class="field"><label>Model</label>
          <input id="edModel" placeholder="model"/>
        </div>
      </div>
      <div class="field"><label>Link (Suno URL)</label>
        <input id="edLink" placeholder="https://..."/>
      </div>
      <div class="field"><label>Image (thumbnail)</label>
        <input id="edImg" placeholder="https://..."/>
      </div>
      <div class="toolbar">
        <button id="applyOne" class="btn good small">Apply to focused</button>
        <button id="applyMany" class="btn small">Apply to selected</button>
      </div>

      <h3>Albums</h3>
      <div class="toolbar">
        <select id="albumsList" class="select"></select>
        <button id="renameAlbum" class="btn small">Rename</button>
        <button id="deleteAlbum" class="btn danger small">Delete</button>
      </div>
    </aside>
  </main>

  <footer class="small">Vanilla JS. Click a cover to open the track on Suno in a new tab. Use the checkbox to select. Export writes a new CSV including an Album column.</footer>

  <script>
    const $ = (sel, el = document) => el.querySelector(sel);
    const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

    const state = {
      rows: [], filtered: [], columns: {},
      imageCol: '', linkCol: '', titleCol: '', durationCol: '', modelCol: '', albumCol: '',
      selected: new Set(), focusId: null,
      albums: [], // {id, name}
    };

    const dz = $('#dz');
    const fileInput = $('#file');
    const grid = $('#grid');
    const q = $('#q');
    const sortSel = $('#sort');
    const empty = $('#empty');

    const exportBtn = $('#export');
    const newAlbumBtn = $('#newAlbum');
    const assignAlbumBtn = $('#assignAlbum');
    const clearAlbumBtn = $('#clearAlbum');
    const deleteSelBtn = $('#deleteSel');
    const dedupeBtn = $('#dedupe');
    const normalizeBtn = $('#normalize');

    const albumSel = $('#albumSel');
    const selCount = $('#selCount');
    const edTitle = $('#edTitle');
    const edDuration = $('#edDuration');
    const edModel = $('#edModel');
    const edLink = $('#edLink');
    const edImg = $('#edImg');
    const applyOne = $('#applyOne');
    const applyMany = $('#applyMany');

    const albumsList = $('#albumsList');
    const renameAlbumBtn = $('#renameAlbum');
    const deleteAlbumBtn = $('#deleteAlbum');

    // Drag and drop
    ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); if (ev==='drop') handleFiles(e.dataTransfer.files); dz.classList.remove('drag'); }));
    fileInput.addEventListener('change', e => handleFiles(e.target.files));

    function handleFiles(fileList) {
      const file = fileList && fileList[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => loadCsv(reader.result);
      reader.readAsText(file);
    }

    // Minimal CSV parser that respects quotes
    function parseCSV(text) {
      const rows = [];
      let cur = '', row = [], i = 0, inQ = false; const n = text.length;
      const pushCell = () => { row.push(cur); cur = ''; };
      const pushRow = () => { rows.push(row); row = []; };
      while (i < n) {
        const c = text[i];
        if (inQ) {
          if (c === '"') {
            if (text[i+1] === '"') { cur += '"'; i++; }
            else inQ = false;
          } else cur += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') pushCell();
          else if (c === '\n' || c === '\r') { if (cur !== '' || row.length) pushCell(); if (row.length) pushRow(); while (text[i+1] === '\n' || text[i+1] === '\r') i++; }
          else cur += c;
        }
        i++;
      }
      if (cur !== '' || row.length) { pushCell(); pushRow(); }
      return rows;
    }

    function toCSV(headers, rows) {
      const esc = (s='') => '"' + String(s).replaceAll('"','""') + '"';
      const head = headers.map(esc).join(',');
      const body = rows.map(r => headers.map(h => esc(r[h] ?? '')).join(',')).join('\n');
      return head + '\n' + body + '\n';
    }

    function download(filename, text) {
      const blob = new Blob([text], {type: 'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function loadCsv(text) {
      const rows = parseCSV(text).filter(r => r.length && r.some(x => String(x).trim() !== ''));
      if (!rows.length) return;
      const headers = rows.shift().map(h => String(h).trim());
      state.columns = headers;
      const lc = headers.map(h => h.toLowerCase());
      const findCol = (cands) => headers[ lc.findIndex(h => cands.some(k => h.includes(k))) ] || '';
      state.imageCol = findCol(['src','image','thumbnail','cover']);
      state.linkCol = findCol(['href','url','link']);
      state.titleCol = findCol(['title','name','cursor-pointer']);
      state.durationCol = findCol(['duration','length','time','px-[2px]']);
      state.modelCol = findCol(['model','version','relative']);
      state.albumCol = findCol(['album','collection']);

      state.rows = rows.map((r, idx) => {
        const obj = Object.fromEntries(headers.map((h, i) => [h, r[i] ?? '']));
        obj.__id = String(idx+1);
        if (!state.albumCol) obj.Album = ''; // ensure column exists
        return obj;
      });
      if (!state.albumCol) { state.albumCol = 'Album'; state.columns = [...headers, 'Album']; }

      // seed albums from data
      const names = new Set(state.rows.map(o => o[state.albumCol]).filter(Boolean));
      state.albums = [...names].map((name, i) => ({ id: 'a'+(i+1), name }));

      refreshAlbumControls();
      applyFilter();
      dz.hidden = true;
    }

    function parseDuration(s) {
      if (!s) return 0;
      const m = String(s).trim().match(/^(\d{1,2}):(\d{2})$/);
      return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : 0;
    }

    function applyFilter() {
      const term = q.value.trim().toLowerCase();
      const rows = state.rows.filter(obj => {
        const t = (obj[state.titleCol] || '').toLowerCase();
        const d = (obj[state.durationCol] || '').toLowerCase();
        const m = (obj[state.modelCol] || '').toLowerCase();
        const alb = (obj[state.albumCol] || '').toLowerCase();
        return !term || t.includes(term) || d.includes(term) || m.includes(term) || alb.includes(term);
      });
      const by = sortSel.value;
      rows.sort((a,b) => {
        if (by === 'duration') return parseDuration(a[state.durationCol]) - parseDuration(b[state.durationCol]);
        if (by === 'album') return (a[state.albumCol]||'').localeCompare(b[state.albumCol]||'') || (a[state.titleCol]||'').localeCompare(b[state.titleCol]||''); 
        const ta = (a[state.titleCol] || '').toLowerCase();
        const tb = (b[state.titleCol] || '').toLowerCase();
        return ta.localeCompare(tb);
      });
      state.filtered = rows;
      render();
    }

    q.addEventListener('input', applyFilter);
    sortSel.addEventListener('change', applyFilter);

    function render() {
      grid.innerHTML = '';
      if (!state.filtered.length) { empty.hidden = false; return; }
      empty.hidden = true;
      const frag = document.createDocumentFragment();
      for (const obj of state.filtered) {
        const img = obj[state.imageCol] || '';
        const href = obj[state.linkCol] || '#';
        const title = (obj[state.titleCol] || 'Untitled').trim() || 'Untitled';
        const duration = obj[state.durationCol] || '';
        const model = obj[state.modelCol] || '';
        const album = obj[state.albumCol] || '';

        const a = document.createElement('a');
        a.className = 'card' + (state.selected.has(obj.__id) ? ' sel' : '');
        a.href = href || '#'; a.target = '_blank'; a.rel = 'noopener';
        a.dataset.id = obj.__id;

        const cover = document.createElement('div'); cover.className = 'cover';
        const image = document.createElement('img'); image.loading = 'lazy'; image.alt = title; image.referrerPolicy = 'no-referrer';
        image.src = img || '';
        cover.appendChild(image);
        if (duration) {
          const b = document.createElement('span'); b.className = 'badge'; b.textContent = duration; cover.appendChild(b);
        }
        if (model) {
          const b2 = document.createElement('span'); b2.className = 'badge alt'; b2.textContent = model; cover.appendChild(b2);
        }
        const pick = document.createElement('label'); pick.className = 'pick';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = state.selected.has(obj.__id);
        cb.addEventListener('click', (e) => { e.stopPropagation(); toggleSelect(obj.__id, cb.checked); });
        pick.appendChild(cb); cover.appendChild(pick);

        const meta = document.createElement('div'); meta.className = 'meta';
        const h3 = document.createElement('div'); h3.className = 'title'; h3.textContent = title; meta.appendChild(h3);
        const sub = document.createElement('div'); sub.className = 'subtitle';
        sub.innerHTML = [album ? `<span class="albumchip">${album}</span>` : '', model ? model : ''].filter(Boolean).join(' · ');
        meta.appendChild(sub);

        a.appendChild(cover);
        a.appendChild(meta);

        a.addEventListener('click', (e) => {
          // normal click goes to Suno. Also focus editor
          state.focusId = obj.__id;
          loadEditor(obj);
        });

        frag.appendChild(a);
      }
      grid.appendChild(frag);
      updateSelCount();
    }

    function toggleSelect(id, on) {
      if (on) state.selected.add(id); else state.selected.delete(id);
      updateSelCount();
      const el = grid.querySelector(`[data-id="${id}"]`); if (el) el.classList.toggle('sel', on);
    }

    function updateSelCount() { selCount.textContent = `${state.selected.size} selected`; }

    function refreshAlbumControls() {
      const makeOpts = (selEl) => {
        selEl.innerHTML = '';
        const optNone = document.createElement('option'); optNone.value = ''; optNone.textContent = '- no album -'; selEl.appendChild(optNone);
        state.albums
          .slice().sort((a,b)=>a.name.localeCompare(b.name))
          .forEach(a => { const o = document.createElement('option'); o.value = a.name; o.textContent = a.name; selEl.appendChild(o); });
      };
      makeOpts(albumSel);
      makeOpts(albumsList);
    }

    function loadEditor(obj) {
      edTitle.value = obj[state.titleCol] || '';
      edDuration.value = obj[state.durationCol] || '';
      edModel.value = obj[state.modelCol] || '';
      edLink.value = obj[state.linkCol] || '';
      edImg.value = obj[state.imageCol] || '';
      albumSel.value = obj[state.albumCol] || '';
    }

    applyOne.addEventListener('click', () => {
      const id = state.focusId; if (!id) return;
      const obj = state.rows.find(r => r.__id === id); if (!obj) return;
      patchFromEditor(obj);
      applyFilter();
    });

    applyMany.addEventListener('click', () => {
      const ids = [...state.selected]; if (!ids.length) return;
      state.rows.forEach(obj => { if (state.selected.has(obj.__id)) patchFromEditor(obj, /*partial*/true); });
      applyFilter();
    });

    function patchFromEditor(obj, partial=false) {
      const set = (key, val) => { if (!partial || val !== '') obj[key] = val; };
      set(state.titleCol, edTitle.value.trim());
      set(state.durationCol, edDuration.value.trim());
      set(state.modelCol, edModel.value.trim());
      set(state.linkCol, edLink.value.trim());
      set(state.imageCol, edImg.value.trim());
      set(state.albumCol, albumSel.value.trim());
    }

    newAlbumBtn.addEventListener('click', () => {
      const name = prompt('Album name'); if (!name) return;
      if (!state.albums.find(a => a.name.toLowerCase() === name.toLowerCase())) state.albums.push({ id: crypto.randomUUID(), name });
      refreshAlbumControls();
    });

    renameAlbumBtn.addEventListener('click', () => {
      const cur = albumsList.value; if (!cur) return;
      const nu = prompt('New album name', cur); if (!nu) return;
      const a = state.albums.find(x => x.name === cur); if (a) a.name = nu;
      state.rows.forEach(o => { if ((o[state.albumCol]||'') === cur) o[state.albumCol] = nu; });
      refreshAlbumControls(); applyFilter();
    });

    deleteAlbumBtn.addEventListener('click', () => {
      const cur = albumsList.value; if (!cur) return;
      if (!confirm(`Delete album "${cur}" and clear it from tracks?`)) return;
      state.albums = state.albums.filter(x => x.name !== cur);
      state.rows.forEach(o => { if ((o[state.albumCol]||'') === cur) o[state.albumCol] = ''; });
      refreshAlbumControls(); applyFilter();
    });

    assignAlbumBtn.addEventListener('click', () => {
      const name = prompt('Assign to which album? Leave blank to clear.', albumSel.value || '');
      if (name === null) return;
      if (name && !state.albums.find(a => a.name.toLowerCase() === name.toLowerCase())) state.albums.push({ id: crypto.randomUUID(), name });
      state.rows.forEach(o => { if (state.selected.has(o.__id)) o[state.albumCol] = (name||''); });
      refreshAlbumControls(); applyFilter();
    });

    clearAlbumBtn.addEventListener('click', () => {
      if (!state.selected.size) return;
      state.rows.forEach(o => { if (state.selected.has(o.__id)) o[state.albumCol] = ''; });
      applyFilter();
    });

    deleteSelBtn.addEventListener('click', () => {
      if (!state.selected.size) return;
      if (!confirm(`Delete ${state.selected.size} selected track(s)?`)) return;
      state.rows = state.rows.filter(o => !state.selected.has(o.__id));
      state.selected.clear();
      applyFilter();
    });

    dedupeBtn.addEventListener('click', () => {
      const seen = new Set();
      const before = state.rows.length;
      state.rows = state.rows.filter(o => {
        const key = (o[state.linkCol]||'').trim();
        if (!key) return true;
        if (seen.has(key)) return false;
        seen.add(key); return true;
      });
      const removed = before - state.rows.length;
      alert(`Removed ${removed} duplicate(s).`);
      applyFilter();
    });

    normalizeBtn.addEventListener('click', () => {
      const normTitle = s => s.replace(/\s+/g,' ').trim().replace(/(^|[\s\-\_])([a-z])/g,(m,pre,ch)=> pre + ch.toUpperCase());
      state.rows.forEach(o => {
        if (state.titleCol) o[state.titleCol] = normTitle(String(o[state.titleCol]||''));
        if (state.durationCol) o[state.durationCol] = String(o[state.durationCol]||'').trim();
        if (state.modelCol) o[state.modelCol] = String(o[state.modelCol]||'').trim();
      });
      applyFilter();
    });

    exportBtn.addEventListener('click', () => {
      const headers = state.columns;
      const csv = toCSV(headers, state.rows);
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      download(`suno_tracks_${stamp}.csv`, csv);
    });

    // Keyboard affordance: j/k scroll, a to toggle select focused
    window.addEventListener('keydown', (e) => {
      if (e.key === 'k') window.scrollBy({ top: -window.innerHeight * 0.8, behavior: 'smooth' });
      if (e.key === 'j') window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' });
      if (e.key.toLowerCase() === 'a' && state.focusId) { const on = !state.selected.has(state.focusId); toggleSelect(state.focusId, on); }
    });
  </script>
</body>
</html>
